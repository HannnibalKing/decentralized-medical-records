name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Contracts - install deps
        working-directory: contracts
        run: |
          forge install foundry-rs/forge-std

      - name: Contracts - test
        working-directory: contracts
        run: |
          forge test -vvv

      - name: Gateway - build
        working-directory: gateway
        run: |
          go vet ./...
          go build ./...

      - name: Web - install
        working-directory: web
        run: |
          npm ci || npm install

      - name: Web - build
        working-directory: web
        env:
          VITE_GATEWAY_URL: http://localhost:8080
        run: |
          npm run build
